name = "pixelboost-astro"
main = "src/worker/index.js"
compatibility_date = "2026-06-03"
workers_dev = false
routes = [
  { pattern = "pixelboost.ca/*", zone_name = "pixelboost.ca" },
  { pattern = "www.pixelboost.ca/*", zone_name = "pixelboost.ca" },
]

# Required Worker secrets:
# - PSI_API_KEY: Google PageSpeed Insights key for /api/audit
# - JMAP_FASTMAIL_API: Fastmail API token (mail-send scope) for sending contact form, audit result, and lead emails via JMAP
# - TURNSTILE_SITE_KEY: public Turnstile widget sitekey injected into /contact
# - TURNSTILE_SECRET: private Turnstile Siteverify secret for POST /contact

# Only ./dist (the Astro build) is uploaded and served. Anything outside it —
# notably scripts/ (the internal lead-gen tooling) and tests/ — is never
# deployed. Astro likewise only builds src/, so scripts/ stays out of dist/.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Canonical URLs are slash-free (/about, not /about/). Serve the bare path and
# redirect the slash form to it, so Google consolidates on one URL. The worker
# (src/worker/index.js) upgrades this redirect from Cloudflare's default 307 to
# a permanent 308 so Google actually drops the old slash URLs from its index.
html_handling = "drop-trailing-slash"
# Without this, asset-matching requests are served directly and the Worker
# never runs: POST /contact 405s at the asset layer (dropping every contact
# lead), the CSP header is never set, and the Turnstile sitekey is never
# injected. The Worker is designed to front all traffic.
run_worker_first = true

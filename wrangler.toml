name = "pixelboost-astro"
main = "src/worker/index.js"
compatibility_date = "2026-06-03"
workers_dev = true
routes = [
  { pattern = "pixelboost.ca/*", zone_name = "pixelboost.ca" },
  { pattern = "www.pixelboost.ca/*", zone_name = "pixelboost.ca" },
]

# Required Worker secrets:
# - PSI_API_KEY: Google PageSpeed Insights key for /api/audit
# - JMAP_FASTMAIL_API: Fastmail API token (mail-send scope) for sending audit result + lead emails via JMAP
# - TURNSTILE_SITE_KEY: public Turnstile widget sitekey injected into /contact
# - TURNSTILE_SECRET: private Turnstile Siteverify secret for POST /contact

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Without this, asset-matching requests are served directly and the Worker
# never runs: POST /contact 405s at the asset layer (dropping every contact
# lead), the CSP header is never set, and the Turnstile sitekey is never
# injected. The Worker is designed to front all traffic.
run_worker_first = true

[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "hello@pixelboost.ca"
